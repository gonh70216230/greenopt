name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  self-test:
    name: 自检 py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 模型一致性自检
        run: python run_greenopt.py --self-test

  smoke:
    name: 端到端快速试跑
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 快速模式（含出图）
        env:
          MPLBACKEND: Agg
        run: python run_greenopt.py --quick
      - name: 检查产物是否生成
        run: |
          test -f results/greenopt_results.xlsx
          test -f results/result_summary.json
          ls results/*.png | wc -l
